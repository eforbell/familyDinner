services:
  db:
    image: postgres:16-alpine
    container_name: family-dinner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_dinner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - family_dinner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d family_dinner"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  family_dinner_pgdata:
