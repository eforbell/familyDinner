<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#292524"/>
  <!-- warm glow -->
  <radialGradient id="g" cx="75%" cy="30%" r="50%">
    <stop offset="0%" stop-color="#f97316" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
  </radialGradient>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="url(#g)"/>
  <!-- emoji -->
  <text x="600" y="310" font-size="200" text-anchor="middle" dominant-baseline="middle">🍽️</text>
  <!-- title -->
  <text x="600" y="460" font-size="56" font-weight="700" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        fill="#fafaf9">Forbell Family Dinner</text>
  <!-- tagline -->
  <text x="600" y="530" font-size="30" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        fill="#a8a29e">What's for dinner tonight?</text>
</svg>
