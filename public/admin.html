<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <title>Dinner Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="sovereign-fonts.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="dinner-skin.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-nav-page="planner" data-nav-root=".">
  <div id="app" class="admin-app">
    <header class="admin-header">
      <div>
        <div class="week-badge">Settings</div>
        <h1>Rotation Template</h1>
      </div>
      <div class="admin-header-actions">
        <a class="btn-ghost" href="plan">Plan the week</a>
        <button class="btn-ghost theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme"></button>
      </div>
    </header>

    <section class="admin-intro">
      <p class="admin-copy">This template only feeds the <strong>Fill from rotation</strong> button on the Plan page. Editing it never changes a week that's already planned.</p>
      <p id="rotation-meta" class="muted">Loading rotation…</p>
      <p id="rotation-status" class="admin-status hidden"></p>
    </section>

    <section class="planner-settings">
      <div class="planner-settings-card">
        <div class="planner-settings-head">
          <div>
            <h2>Order-in options</h2>
            <p class="muted">One option per line. Put an emoji first if you want it shown in the vote.</p>
          </div>
          <button id="save-restaurants-btn" class="btn-ghost" type="button">Save options</button>
        </div>
        <textarea
          id="restaurant-options"
          class="planner-settings-textarea"
          rows="6"
          placeholder="🌯 Chipotle&#10;🥡 Panda Express&#10;🍕 Pizza"
        ></textarea>
      </div>
    </section>

    <section id="rotation-grid" class="rotation-grid"></section>
  </div>

  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="admin.js"></script>
</body>
</html>
