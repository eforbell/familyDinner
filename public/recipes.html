<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <title>Recipes</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="sovereign-fonts.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="dinner-skin.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-nav-page="recipes" data-nav-root=".">
  <div id="app" class="admin-app">
    <header class="admin-header">
      <div>
        <div class="week-badge">Recipe Library</div>
        <h1>Recipes</h1>
      </div>
      <div class="admin-header-actions">
        <a class="btn-ghost" href="admin/recipes">Recipe Builder</a>
        <button class="btn-ghost theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme"></button>
      </div>
    </header>

    <section class="admin-intro">
      <p class="admin-copy">Search the family recipe library, tap a recipe, and go straight to the cook-view.</p>
      <p id="recipe-status" class="admin-status hidden"></p>
    </section>

    <section class="meal-admin-layout recipe-layout">
      <section class="meal-library-panel recipe-browser-panel">
        <div class="recipe-toolbar">
          <input id="recipe-search" class="meal-search" type="search"
                 placeholder="Search recipes, tags, ingredients…" autocomplete="off">
          <select id="recipe-sort" class="recipe-sort" aria-label="Sort recipes">
            <option value="title">A → Z</option>
            <option value="newest">Newest first</option>
            <option value="time">Quickest first</option>
          </select>
        </div>
        <div id="recipe-count" class="recipe-count"></div>
        <div id="recipe-list" class="recipe-card-grid"></div>
      </section>
    </section>
  </div>

  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="recipes.js"></script>
</body>
</html>
